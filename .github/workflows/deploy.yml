# Builds the site with tools/build.py and publishes it on GitHub Pages.
# Runs on every push to main — including saves from the Pages CMS dashboard.
name: Build & publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install build tools
        run: pip install beautifulsoup4 pillow
      - name: Build pages
        run: python tools/build.py
      - name: Collect the public files
        run: |
          mkdir -p _site
          cp -R index.html en services css js assets sitemap.xml robots.txt _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
